services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: telemetry-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SIMULATION_HZ=100
      - BROADCAST_HZ=60
      - DEADBAND=0.001
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - telemetry-net

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: telemetry-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - telemetry-net

networks:
  telemetry-net:
    driver: bridge
